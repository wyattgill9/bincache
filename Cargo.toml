[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
# `http1` is the whole protocol surface a Nix client speaks; `tokio` brings `axum::serve`.
# Nothing here wants JSON, forms, or query extraction.
axum            = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes           = { version = "1.12" }
clap            = { version = "4.6", features = ["derive", "env"] }
data-encoding   = { version = "2.9" }
derive_more     = { version = "2.1", features = ["as_ref", "display", "from"] }
ed25519-dalek   = { version = "3.0", features = ["rand_core"] }
expect-test     = { version = "1.5" }
# `StreamExt::next`, for draining an upload body frame by frame. Already in the tree under
# axum and tower; named here so the use is declared rather than incidental.
futures-util    = { version = "0.3", default-features = false }
rand            = { version = "0.9" }
sha2            = { version = "0.11" }
snafu           = { version = "0.9" }
strum           = { version = "0.28", features = ["derive"] }
subtle          = { version = "2.6" }
swrite          = { version = "0.1" }
tokio           = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
# `io` for `ReaderStream`, which turns an open artifact into a response body.
tokio-util      = { version = "0.7", default-features = false, features = ["io"] }
tracing         = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd            = { version = "0.13" }

pretty_assertions = { version = "1.4" }

bincache-core   = { path = "crates/bincache-core" }
bincache-ingest = { path = "crates/bincache-ingest" }
bincache-serve  = { path = "crates/bincache-serve" }
bincache-store  = { path = "crates/bincache-store" }

[workspace.lints.rust]
# Nothing in this workspace writes unsafe. Kept at `deny` rather than `forbid` only so a
# future module can carve out an exception deliberately, in the open, at that module.
unsafe_code = "deny"

[workspace.lints.clippy]
# Each of these = a missing fallible boundary; fix with try_from, never `as`.
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

# crane reads this for the deps-only/clippy/test derivations (no root [package] here).
[workspace.metadata.crane]
name = "bincache"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
